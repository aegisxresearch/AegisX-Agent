[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisx-agent"
version = "0.1.0"
description = "AegisX Agent — Super-powered Agentic AI with full tool calling, RAG, planning, memory, and code generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AegisX" }]

dependencies = [
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.8.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0.0",
    "numpy>=1.26.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
mcp = [
    "mcp>=2.0.0",
]

[project.scripts]
aegisx = "aegisx_agent.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Untyped third-party packages the checker would otherwise follow into;
# chromadb's import chain reaches numpy, whose shipped stubs use PEP 695
# 'type' statements that cannot be parsed while checking python_version 3.10.
module = ["chromadb.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aegisx_agent"]
omit = [
    # Back-compat shims: re-export modules at their historical import paths.
    "aegisx_agent/config.py",
    "aegisx_agent/agent_loop.py",
]

[tool.coverage.report]
# Baseline measured when the gate was introduced; raise as coverage grows.
fail_under = 77
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["aegisx_agent"]
